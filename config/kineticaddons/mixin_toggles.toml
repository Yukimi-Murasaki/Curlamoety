# KineticAddons 核心注入机制控制面板
# KineticAddons Mixin Toggles
# 格式: Module.ClassName = true/false
# Format: Module.ClassName = true/false
# 注意: 修改此文件后必须重启游戏才能生效
# Notice: Restart required after changes

# [核心重构: 铁砧、附魔与属性]
# [Core Refactoring: Anvil & Enchantment]

# 铁砧与附魔底层综合重构：
# 1. 铁砧解限：彻底移除 40 级“过于昂贵”限制，移除多次修理的累积经验惩罚(PWP)。
# 2. 附魔平滑化：实现免税附魔与线性经验扣除机制，并注入服务端附魔台。
# 3. 拦截与解封：突破原版附魔等级上限，智能双模配置过滤，并注入底层 Helper 确保跨模组兼容。
# Anvil & Enchantment Core Refactoring:
# 1. Anvil Unlock: Removes the 40-level limit and Prior Work Penalty (PWP) for endless repairs.
# 2. Smooth XP: Implements tax-free, linear XP deduction, syncing with server-side enchantment tables.
# 3. Intercept & Uncap: Removes max level caps, applies smart bi-modal filtering, and injects into base Helpers for cross-mod compatibility.
anvilenchantment.AnvilEnchantmentCoreMixin = true

# 铁砧界面优化：从 GUI 渲染层面彻底抹除“过于昂贵”的红色警告文本。
# Anvil UI Optimization: Visually removes the red 'Too Expensive' warning text from the GUI.
anvilenchantment.AnvilMixin = true

# 第六感附魔 (Sixth Sense)：
# 1. 潜行透视：玩家潜行时激活周围生物透视描边效果。
# 2. 动态渲染：支持基于实体类型或敌对状态的自定义颜色渲染。
# Sixth Sense Enchantment:
# 1. Sneak Wallhack: Activates glowing outlines on entities when the player sneaks.
# 2. Dynamic Rendering: Custom outline colors based on entity type or hostility.
anvilenchantment.EntityGlowingMixin = true

# [其他核心机制]
# [Other Core Mechanics]

# 物品与方块行为综合修正：
# 1. 真·无限弓：无限弓在背包无箭矢时依然可以拉弓射击。
# 2. 万能工具安全协议：不递归调用掉落表；强制掉落名单方块并压制经验；自动处理树叶、蜘蛛网等剪刀类方块；取消刷怪笼破坏经验。
# 3. 万能工具特性注入：作为“超级宝藏附魔”加入 30 级候选池；修复 Jade 挖掘判定并兼容耐久磨损与诅咒。
# 4. 引雷优化：强化三叉戟引雷判定逻辑，放宽雷雨天气的严苛要求。
# Item & Block Behavior Overhaul:
# 1. True Infinity Bow: Infinity bows can be drawn and fired even with zero arrows in inventory.
# 2. Omni-Tool Safety: Avoids recursive loot calls; force-drops configured blocks while suppressing XP; safely handles shears-only blocks and cancels spawner XP.
# 3. Omni-Tool Injection: Added to level 30+ pools as a super treasure enchant; fixes Jade tool checks while respecting durability curses.
# 4. Channeling Tweaks: Optimizes Trident Channeling, relaxing the strict thunderstorm requirement.
anvilenchantment.ItemAndBlockBehaviorMixin = true

# 无限流体桶：赋予流体桶无限属性，支持无限次吸水与倒水而不被消耗。
# Infinite Fluid Bucket: Grants buckets infinite properties for endless filling and emptying.
anvilenchantment.InfinityBucketMixins = true

# [交易与交互系统]
# [Trade & Interaction System]

# 钱包村民交易自动补货：
# 1. 智能提取：点击交易时，自动从玩家钱包提取货币补满交易槽。
# 2. 自动退款：关闭界面时，交易槽中剩余的货币会自动存回钱包。
# 3. 完美兼容：仅针对钱包配置内的货币物品生效，普通交易材料保持原版行为。
# Wallet Villager Trade Auto Refill:
# 1. Smart Withdrawal: Automatically withdraws currency from the wallet to fill payment slots upon trade selection.
# 2. Auto Refund: Leftover currency is deposited back into the wallet when the GUI is closed.
# 3. Seamless Compat: Only handles configured wallet currencies; normal items behave as vanilla.
curios.MerchantMenuMixin = true
