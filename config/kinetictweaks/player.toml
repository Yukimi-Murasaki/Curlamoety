
#首次进入奖励设置
#First Join Reward Settings
[first_join]
	# 启用首次加入奖励功能
	# Enable the First Join reward feature
	enable = false
	# 发放奖励前清空玩家背包
	#Clear the player's inventory before giving rewards
	clear_inventory = false
	# 发放奖励的延迟时间 (刻)
	#Delay before giving rewards (in ticks)
	delay_ticks = 20
	# 奖励物品列表 (支持 '[槽位] 数量x 物品ID{NBT}' 格式)
	#Reward item list (Supports '[Slot] Countx ItemID{NBT}' format)
	items = ["[0] 1x minecraft:iron_sword", "[1] 32x minecraft:bread", "[2] 16x minecraft:apple"]
	# 玩家首次加入时执行的指令列表
	#List of commands to execute when a player first joins
	commands = []

	#初始装备 (支持 NBT，每个部位可独立设定)
	#Starting Equipment (Supports NBT, each slot can be configured independently)
	[first_join.armor]
		# 头盔
		# Helmet
		helmet = "1x minecraft:leather_helmet{Enchantments:[{id:\"minecraft:unbreaking\",lvl:2s},{id:\"minecraft:protection\",lvl:2s},{id:\"minecraft:respiration\",lvl:1s}]}"
		# 胸甲
		# Chestplate
		chestplate = "1x minecraft:leather_chestplate{Enchantments:[{id:\"minecraft:unbreaking\",lvl:2s},{id:\"minecraft:protection\",lvl:2s}]}"
		# 护腿
		# Leggings
		leggings = "1x minecraft:leather_leggings{Enchantments:[{id:\"minecraft:unbreaking\",lvl:2s},{id:\"minecraft:protection\",lvl:2s}]}"
		# 靴子
		# Boots
		boots = "1x minecraft:leather_boots{Enchantments:[{id:\"minecraft:unbreaking\",lvl:2s},{id:\"minecraft:protection\",lvl:2s}]}"
		# 副手物品
		# Offhand Item
		offhand = "1x minecraft:shield"

